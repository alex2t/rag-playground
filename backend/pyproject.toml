[project]
name = "rag-playground"
version = "0.1.0"
description = "Measures which RAG techniques work, one variable at a time, on two stacks."
readme = "README.md"
authors = [
    { name = "alex2t", email = "11904316+alex2t@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "llama-index-core>=0.14.25",
    "openai>=3.38.0",
    "pydantic-settings>=2.16.1",
    "qdrant-client>=1.20.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real external APIs (skipped by default)"]
addopts = "-m 'not live'"

[tool.uv]
# Copy instead of hard-linking: nltk refuses to open multiply-linked data files (CWE-59 check).
link-mode = "copy"
