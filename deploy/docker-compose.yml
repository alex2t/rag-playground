# One environment: app + qdrant. Run as project rag-playground-staging or rag-playground-prod (D13).
# Qdrant has no published port, so it is reachable only from the app on the compose network.
# Secrets and settings come from the shell that runs compose (D32):
#   VPS:   doppler run -- docker compose -f deploy/docker-compose.yml -p rag-playground-<env> up -d
#   local: docker compose --env-file .env -f deploy/docker-compose.yml -p rag-playground-dev up -d --build
# A name left unset is unset in the container, so the app's default applies (BUDGET_USD unset = $0, nothing paid runs).

services:
  app:
    image: ${APP_IMAGE:-rag-playground:dev}
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    environment:
      - APP_ENV
      - OPENAI_API_KEY
      - OPENROUTER_API_KEY
      - BUDGET_USD
      - READ_ONLY
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - app-var:/app/var
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  app-var:
  qdrant-data:
