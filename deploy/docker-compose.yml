# The app and its Qdrant, run as project rag-playground-prod on the VPS (D35: prod only).
# Qdrant has no published port, so it is reachable only from the app on the compose network.
# The app listens on 127.0.0.1:8000 only; the server's Nginx is the public front door (D35).
# Memory limits keep the project from taking memory from the other sites on the server (D35):
# about 190 MB idle, 950 MB with nomic loaded, up to 2 GB during a Stack B index build (measured).
# Secrets and settings come from the shell that runs compose (D32):
#   VPS:   deploy/deploy.sh <git-sha>   (doppler run -- docker compose ... up -d)
#   local: docker compose --env-file .env -f deploy/docker-compose.yml -p rag-playground-dev up -d --build
# A name left unset is unset in the container, so the app's default applies (BUDGET_USD unset = $0, nothing paid runs).

services:
  app:
    image: ${APP_IMAGE:-rag-playground:dev}
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    environment:
      - APP_ENV
      - OPENAI_API_KEY
      - OPENROUTER_API_KEY
      - BUDGET_USD
      - READ_ONLY
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - app-var:/app/var
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 2g
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes:
      - qdrant-data:/qdrant/storage
    mem_limit: 512m
    restart: unless-stopped

volumes:
  app-var:
  qdrant-data:
