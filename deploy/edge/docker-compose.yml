# Shared edge (D09): Caddy on ports 80 and 443 in front of both environments. Run as project rag-playground-edge.
# Host networking: Caddy reaches each app on 127.0.0.1 (the apps publish no public port), logs the visitor's real
# address for fail2ban, and fail2ban's bans apply to it directly.
# DOMAIN, AUTH_USER and AUTH_HASH (from `caddy hash-password`) come from Doppler's prod config (D33):
#   doppler run -- docker compose -f deploy/edge/docker-compose.yml -p rag-playground-edge up -d

services:
  caddy:
    image: caddy:2.11.9
    network_mode: host
    environment:
      - DOMAIN
      - AUTH_USER
      - AUTH_HASH
      - PROD_UPSTREAM=127.0.0.1:8000
      - STAGING_UPSTREAM=127.0.0.1:8001
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - /var/log/caddy:/var/log/caddy
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
