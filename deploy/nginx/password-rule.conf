# Password rule for rag-playground.cloud (D32, D35). Prod is public to read: GET (and HEAD, which
# Nginx allows with GET) passes; every other method needs the password.
# Paste these lines at the top of the `location @reverse_proxy { ... }` block of the site's Vhost in
# CloudPanel, before its proxy_pass, then save (CloudPanel runs nginx -t). Not in `location /`:
# CloudPanel's `location /` forwards with `try_files $uri @reverse_proxy`, and limit_except is a
# nested location that inherits proxy_pass but not try_files, so there an authorised POST got 404.
# Remove CloudPanel's `listen ... quic` lines from this site: fail2ban bans TCP only, so HTTP/3 (UDP)
# would let a banned address keep guessing.
# /etc/nginx/rag-playground.htpasswd holds one line, `<user>:<hash>`: AUTH_USER and AUTH_HASH
# from Doppler's prd config (bcrypt, cost 10), readable by the Nginx worker user only.
limit_except GET {
    auth_basic "rag-playground";
    auth_basic_user_file /etc/nginx/rag-playground.htpasswd;
}
