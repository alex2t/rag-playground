# Password rule for rag-playground.cloud (D32, D35). Prod is public to read: GET (and HEAD, which
# Nginx allows with GET) passes; every other method needs the password.
# Paste these lines inside the `location / { ... }` block of the site's Vhost in CloudPanel, next to
# its proxy_pass, then run `nginx -t` before saving. Do not add `listen 443 quic` to this site:
# fail2ban bans TCP only, so HTTP/3 (UDP) would let a banned address keep guessing.
# /etc/nginx/rag-playground.htpasswd holds one line, `<user>:<hash>`: AUTH_USER and AUTH_HASH
# from Doppler's prd config (bcrypt, cost 10), readable by the Nginx worker user only.
limit_except GET {
    auth_basic "rag-playground";
    auth_basic_user_file /etc/nginx/rag-playground.htpasswd;
}
