# Tests, then the release image pushed to GHCR as :<git-sha> (D34), then the evaluation gate on that image (D36)
# when the push changed backend/, frontend/ or this workflow, then, after the owner approves (environment
# `production`), the deploy over SSH. Only a commit whose gate ran and passed is deployed. Rollback: re-run the
# deploy job of an earlier run.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend
      - name: Backend tests (offline, live tests skipped)
        working-directory: backend
        run: uv run --locked pytest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint and tests
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          build-args: APP_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ghcr.io/alex2t/rag-playground:${{ github.sha }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  changes:
    runs-on: ubuntu-24.04
    outputs:
      gate: ${{ steps.diff.outputs.gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Does this push need the evaluation gate?
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        # Notes-only pushes skip the paid gate (D36). A manual run, or a push whose changes cannot be listed
        # (first push, rewritten history), runs it: skipping is the unsafe default.
        run: |
          if [ "$EVENT" != push ] || ! changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA"); then
            gate=true
          elif printf '%s\n' "$changed" | grep -qE '^(backend/|frontend/|\.github/workflows/)'; then
            gate=true
          else
            gate=false
          fi
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          echo "Evaluation gate needed: $gate"

  gate:
    needs: [image, changes]
    if: needs.changes.outputs.gate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
    steps:
      - name: Evaluation gate on the new image (paid, about $0.10, capped at $1)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE: ghcr.io/alex2t/rag-playground:${{ github.sha }}
        run: >-
          docker run --rm --network host
          -e OPENROUTER_API_KEY -e OPENAI_API_KEY -e BUDGET_USD=1 -e QDRANT_URL=http://127.0.0.1:6333
          "$IMAGE" python scripts/eval_gate.py

  deploy:
    needs: gate
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: Deploy this commit to prod (forced command on the VPS)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
        # The key can only run deploy/ci-deploy.sh, which takes the SHA as its one input; the host key is pinned.
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$VPS_HOST" "$GITHUB_SHA"
